# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: IIS Lab · University of Tehran
name: Intelligent Information Systems Lab
name_fa: آزمایشگاه سیستم‌های هوشمند اطلاعات
description: > # this means to ignore newlines until "baseurl:"
  The Intelligent Information Systems (IIS) Lab at the University of Tehran works on information retrieval, cross-language search, Persian NLP and LLM evaluation, and releases open Persian datasets and models.
baseurl: ""
url: "https://ut-iislab.github.io"
github: https://github.com/ut-iislab

# Search keywords, used in the keywords meta tag and structured data.
# Pages can add their own with a `keywords:` list in their front matter.
keywords:
  - IIS Lab
  - Intelligent Information Systems Lab
  - University of Tehran
  - UT IIS Lab
  - School of Electrical and Computer Engineering
  - information retrieval
  - natural language processing
  - Persian NLP
  - Farsi NLP
  - cross-language information retrieval
  - large language models
  - LLM evaluation
  - Persian datasets
  - Azadeh Shakery
  - آزمایشگاه سیستم‌های هوشمند اطلاعات
  - دانشگاه تهران
  - بازیابی اطلاعات
  - پردازش زبان طبیعی
  - پردازش زبان فارسی
  - مدل‌های زبانی بزرگ

include:
  - .htaccess
  - _pages

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

plugins:
  - jemoji


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links
