- date: Sep 2026
  headline: 'Our paper "ParsVoice: A Large-Scale Multi-Speaker Persian Speech Corpus for Text-to-Speech Synthesis" has been accepted at the **EMNLP 2026 Main Conference**, congratulations!'

- date: Sep 2026
  headline: 'ParsVoice is now public, with 2,178 hours of Persian speech from 1,803 speakers on [Hugging Face](https://huggingface.co/datasets/MohammadJRanjbar/ParsVoice), the corpus-building pipeline on [GitHub](https://github.com/MohammadJRanjbar/ParsVoice), and a fine-tuned [XTTS model](https://huggingface.co/MohammadJRanjbar/ParsVoice-XTTS).'

- date: Apr 2026
  headline: 'The PersianPunc [dataset](https://huggingface.co/datasets/MohammadJRanjbar/PersianPunc) and [ParsBERT punctuation model](https://huggingface.co/MohammadJRanjbar/parsbert-persian-punctuation) are released.'

