<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include seo.html %}
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem('iis-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Vazirmatn:wght@400..600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl | prepend: site.url }}">
  <link rel="icon" type="image/x-icon" href="{{ site.url }}{{ site.baseurl }}/images/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ site.url }}{{ site.baseurl }}/images/favicon_io/favicon-32x32.png">
  <link rel="apple-touch-icon" href="{{ site.url }}{{ site.baseurl }}/images/favicon_io/apple-touch-icon.png">
  <link rel="manifest" href="{{ site.url }}{{ site.baseurl }}/images/favicon_io/site.webmanifest">
{% if jekyll.environment == 'production' %}
{% include analytics.html %}
{% endif %}
</head>
