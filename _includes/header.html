{% assign base = site.url | append: site.baseurl %}
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ base }}/" aria-label="IIS Lab home">
      {% include mark.html %}
      <span class="brand-text">
        <span class="brand-name">IIS Lab</span>
        <span class="brand-sub">University of Tehran</span>
      </span>
    </a>

    <button class="icon-btn nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>

    <nav id="site-nav" class="site-nav" aria-label="Main">
      <a href="{{ base }}/" {% if page.url == "/" %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ base }}/research/" {% if page.url contains "/research" %}aria-current="page"{% endif %}>Research</a>
      <a href="{{ base }}/team/" {% if page.url contains "/team" %}aria-current="page"{% endif %}>People</a>
      <a href="{{ base }}/publications/" {% if page.url contains "/publications" %}aria-current="page"{% endif %}>Publications</a>
      <a href="{{ base }}/resources/" {% if page.url contains "/resources" %}aria-current="page"{% endif %}>Resources</a>
      <a href="{{ base }}/allnews.html" {% if page.url contains "allnews" %}aria-current="page"{% endif %}>News</a>
      <button class="icon-btn theme-toggle" type="button" aria-label="Toggle dark mode">
        <i class="fa-solid fa-moon" aria-hidden="true"></i>
        <i class="fa-solid fa-sun" aria-hidden="true"></i>
      </button>
    </nav>
  </div>
</header>
